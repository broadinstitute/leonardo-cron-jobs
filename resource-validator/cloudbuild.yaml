steps:
  - name: 'sbtscala/scala-sbt:openjdk-17.0.2_1.7.2_2.13.10'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'sbt "testOnly -- -l cronJobs.dbTest" "resourceValidator/docker:stage"'
    env:
      - 'JAVA_OPTS=-Xmx4G -Xms4G -Xss2M'
  - name: 'gcr.io/cloud-builders/docker'
    args: [ 'build', '-t', 'us.gcr.io/broad-dsp-gcr-public/resource-validator:latest', 'resource-validator/target/docker/stage/' ]
  - name: 'gcr.io/cloud-builders/docker'
    args: [ 'image', 'tag', 'us.gcr.io/broad-dsp-gcr-public/resource-validator:latest', 'us.gcr.io/broad-dsp-gcr-public/resource-validator:$SHORT_SHA']
images: [
    'us.gcr.io/broad-dsp-gcr-public/resource-validator:$SHORT_SHA',
    'us.gcr.io/broad-dsp-gcr-public/resource-validator:latest'
]
